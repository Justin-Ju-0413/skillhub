[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skillhub"
version = "0.1.2"
description = "Local centralized skill/tool registry shared across all AI agent platforms on one machine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "GSTAR" }]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "pyyaml>=6.0",
    "tomli_w>=1.0",
]

[project.scripts]
skillhub = "skillhub.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
skillhub = ["py.typed"]

[tool.unittest]
start-directory = "tests"
