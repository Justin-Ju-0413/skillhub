name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: skillhub --help
      - run: skillhub doctor
        env:
          SKILLHUB_HOME: ${{ runner.temp }}/skillhub-smoke

  package-smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install . pyinstaller
      - run: pyinstaller --clean skillhub.spec
      - run: dist/skillhub.exe --help
      - name: Record artifact checksum
        shell: pwsh
        run: Get-FileHash dist/skillhub.exe -Algorithm SHA256 | Format-List
